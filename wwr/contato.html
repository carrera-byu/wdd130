<!DOCTYPE html>
<html lang="pt-BR"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Descrição da página para SEO -->
  <meta name="description" content="Entre em contato com a V.C Rafting. Tire suas dúvidas, faça reservas e conheça nossa equipe.">
  <!-- Autor da página -->
  <meta name="author" content="Victor José">
  <title>Fale Conosco | V.C Rafting</title>
  <!-- Arquivo CSS principal -->
  <link rel="stylesheet" href="estilos/rafting.css">
</head>
<body>

  
  <header>
    <img src="imagens/logo.png" alt="Logo V.C Rafting">
    <nav>
      <a href="index.html">Início</a>
      <a href="sobre.html">Sobre</a>
      <a href="passeios.html">Passeios</a>
      <a href="contato.html">Fale Conosco</a>
    </nav>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main>
    <h1>V.C RAFTING</h1>
    <!-- Dados de endereço e contato da empresa -->
    <p class="info-empresa">
      Av. Paulista, 1000, São Paulo - SP<br>
      Telefone: +55 11 99999-9999<br>
      E-mail: contato@aventurarafing.com
    </p>
    
    <!-- CONTAINER COM 2 COLUNAS: MAPA E FORMULÁRIO -->
    <div class="contato-container">
      <!-- COLUNA 1: MAPA DO GOOGLE -->
      <section class="mapa-box">
        <h2>Localização</h2>
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3656.897123456789!2d-46.633!3d-23.550!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce59c123456789%3A0xabcdef123456789!2sAv.%20Paulista%2C%201000%20-%20São%20Paulo%20-%20SP!5e0!3m2!1spt-BR!2sbr!4v1691234567890!5m2!1spt-BR!2sbr" 
          width="100%" height="300" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </section>

      <!-- COLUNA 2: FORMULÁRIO DE CONTATO -->
      <form>
        <h2>Entre em Contato</h2>
        <!-- Campo para o nome -->
        <div class="form-item">
          <label for="nome">Nome:</label>
          <input type="text" id="nome" name="nome" required>
        </div>
        <!-- Campo para o e-mail -->
        <div class="form-item">
          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" required>
        </div>

        <!-- Opções de motivo do contato -->
        <div class="form-item">
          <p>Propósito:</p>
          <div>
            <input type="radio" id="consulta" name="motivo" value="consulta">
            <label for="consulta">Consulta Geral</label>
          </div>
          <div>
            <input type="radio" id="reserva" name="motivo" value="reserva">
            <label for="reserva">Pergunta sobre Reserva</label>
          </div>
          <div>
            <input type="radio" id="sugestao" name="motivo" value="sugestao">
            <label for="sugestao">Sugestão de Site</label>
          </div>
        </div>

        <!-- Campo para a mensagem -->
        <div class="form-item">
          <label for="mensagem">Mensagem:</label>
          <textarea id="mensagem" name="mensagem" rows="4" required></textarea>
        </div>

        <!-- Checkbox para newsletter -->
        <div class="form-item checkbox">
          <input type="checkbox" id="newsletter" name="newsletter">
          <label for="newsletter">Quero receber a newsletter mensal</label>
        </div>

        <!-- Botão para enviar o formulário -->
        <button type="submit">Enviar Mensagem</button>
      </form>
    </div>

    <!-- TÍTULO DA SEÇÃO EQUIPE -->
   <h2>Conheça Nossa Equipe</h2>
   <!-- GRID COM 3 FUNCIONÁRIOS -->
<div class="equipe-grid">
  <figure>
    <img src="imagens/carlos-silva.jpg" alt="Carlos - Guia de Rafting">
    <figcaption>Carlos - Guia de Rafting</figcaption>
  </figure>
  <figure>
    <img src="imagens/ana-souza.jpg" alt="Ana - Atendimento ao Cliente">
    <figcaption>Ana - Atendimento ao Cliente</figcaption>
  </figure>
  <figure>
    <img src="imagens/joao-pereira.jpg" alt="João - Segurança">
    <figcaption>João - Segurança</figcaption>
  </figure>
</div>
    </section> 
  </main>

  <!-- RODAPÉ COM DIREITOS E REDES SOCIAIS -->
  <footer>
    <p>&copy; 2026 V.C Rafting. Victor José</p>
    <div class="redes-sociais">
      <a href="https://facebook.com" target="_blank">
        <img src="imagens/facebook.png" alt="Facebook">
      </a>
      <a href="https://twitter.com" target="_blank">
        <img src="imagens/twitter.png" alt="Twitter">
      </a>
      <a href="https://instagram.com" target="_blank">
        <img src="imagens/instagram.png" alt="Instagram">
      </a>
    </div>
  </footer>

</body>
</html>
